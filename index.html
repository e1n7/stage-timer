<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#141414" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage Timer</title>
    <meta name="description" content="A web-based stage timer application with countdown, countup, and time-of-day modes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // ======================================================================
      // VERSION RULE (IMPORTANT — do not remove this comment):
      // PWA version marker. RULE: bump this version (vN -> vN+1) on EVERY push,
      // so installed PWA users clear their cached bundle.
      // This app is installed as a PWA on users' devices. To make installed
      // users pick up new code, you MUST bump the version below after EVERY
      // code change that gets pushed/deployed:
      //   v3 -> v4 -> v5 -> ... (always increase by one)
      // Never reuse an old version number. If the number is not bumped, the
      // app will keep running the old cached bundle for PWA-installed users.
      // This marker drives the cache-wipe logic below: caches are only
      // cleared when the marker changes, so normal visits stay fast.
      // ======================================================================
      try {
        if ('localStorage' in window) {
          var currentVersion = 'v13';
          var storedVersion = localStorage.getItem('appVersion');
          if (storedVersion !== currentVersion) {
            localStorage.setItem('appVersion', currentVersion);
            if ('caches' in window) {
              caches.keys().then(function (names) {
                for (var i = 0; i < names.length; i++) {
                  if (names[i].indexOf('stage-timer-') === 0) caches.delete(names[i]);
                }
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                var appScope = new URL('./', window.location.href).href;
                for (var i = 0; i < registrations.length; i++) {
                  if (registrations[i].scope === appScope) registrations[i].unregister();
                }
              });
            }
          }
        }
      } catch (e) { /* localStorage may be unavailable; never break the app */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
