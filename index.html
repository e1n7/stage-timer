<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#141414" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage Timer</title>
    <meta name="description" content="A web-based stage timer application with countdown, countup, and time-of-day modes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Version-gated cache clearing: only wipes stale caches when this
      // version marker changes. On a fresh visit it clears old caches once,
      // then skips on every subsequent load so installed PWAs keep working.
      try {
        if ('localStorage' in window) {
          var currentVersion = 'v3';
          var storedVersion = localStorage.getItem('appVersion');
          if (storedVersion !== currentVersion) {
            localStorage.setItem('appVersion', currentVersion);
            if ('caches' in window) {
              caches.keys().then(function (names) {
                for (var i = 0; i < names.length; i++) caches.delete(names[i]);
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (var i = 0; i < registrations.length; i++) registrations[i].unregister();
              });
            }
          }
        }
      } catch (e) { /* localStorage may be unavailable; never break the app */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
